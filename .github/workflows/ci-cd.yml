name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- CI: backend ----------
  server:
    name: Backend - lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present

  # ---------- CI: frontend ----------
  client:
    name: Frontend - lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: youtube/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
        continue-on-error: true   # TODO: fix the 'any' types, then remove this line
      - run: npm test --if-present
      - run: npm run build
        env:
          CI: false

  # ---------- CD: build and push both images (main only) ----------
  docker:
    name: Build and push ${{ matrix.component }} image
    needs: [server, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [server, youtube]
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_API_URL=${{ vars.API_URL }}
            REACT_APP_API_URL=${{ vars.API_URL }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # ---------- CD: deploy (skipped if no hooks are configured) ----------
  deploy:
    name: Deploy
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hooks
        env:
          SERVER_HOOK: ${{ secrets.SERVER_DEPLOY_HOOK_URL }}
          CLIENT_HOOK: ${{ secrets.CLIENT_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$SERVER_HOOK" ] && [ -z "$CLIENT_HOOK" ]; then
            echo "No deploy hooks set, skipping deploy."
            exit 0
          fi
          [ -n "$SERVER_HOOK" ] && curl -fsS -X POST "$SERVER_HOOK"
          [ -n "$CLIENT_HOOK" ] && curl -fsS -X POST "$CLIENT_HOOK"
          exit 0