# Run the whole stack locally with:  docker compose up --build
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      # Rename these to match the variable names your server reads
      MONGO_URI: mongodb://mongo:27017/yourtube
      PORT: 5000
    depends_on:
      - mongo

  client:
    build:
      context: ./youtube
      args:
        VITE_API_URL: http://localhost:5000
        REACT_APP_API_URL: http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo-data:
